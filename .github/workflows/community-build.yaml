name: Community Build

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:

permissions:
  contents: read

# Dependencies are cached with coursier/cache-action rather than with setup-java's `cache: 'sbt'`:
# the latter uses the same key for all jobs, so only the dependencies of the first job to finish
# would be cached, and the other jobs would download theirs from Maven Central on every run.
# Caches are only saved from main, so that caches of PRs do not evict them from the cache storage.
jobs:

  community_build_a:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Run Community Build A
        run: |
          ./project/scripts/sbt "community-build/testOnly dotty.communitybuild.CommunityBuildTestA"

  community_build_b:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Run Community Build B
        run: |
          ./project/scripts/sbt "community-build/testOnly dotty.communitybuild.CommunityBuildTestB"

  community_build_c:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Run Community Build C
        run: |
          ./project/scripts/sbt "community-build/testOnly dotty.communitybuild.CommunityBuildTestC"
