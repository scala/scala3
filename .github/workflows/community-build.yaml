      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Run Community Build C
        run: |
          ./project/scripts/sbt "community-build/testOnly dotty.communitybuild.CommunityBuildTestC"
