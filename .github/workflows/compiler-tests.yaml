name: Compiler Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:

permissions:
  contents: read

# Dependencies are cached with coursier/cache-action rather than with setup-java's `cache: 'sbt'`:
# the latter uses the same key for all jobs, so only the dependencies of the first job to finish
# would be cached, and the other jobs would download theirs from Maven Central on every run.
# Caches are only saved from main, so that caches of PRs do not evict them from the cache storage.
jobs:

  test-scala3-compiler-nonbootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}

      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16

      - name: Test `scala3-compiler-nonbootstrapped`
        run: ./project/scripts/sbt scala3-compiler-nonbootstrapped/test

      - name: Cmd Tests
        run: |
          ./project/scripts/sbt scala3-nonbootstrapped/publishLocal
          ./project/scripts/cmdTests

  test-scala3-compiler-bootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}

      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16

      - name: Test `scala3-compiler-bootstrapped`
        run: ./project/scripts/sbt scala3-compiler-bootstrapped/test

      - name: Cmd Tests
        run: |
          ./project/scripts/sbt scala3-bootstrapped/publishLocal
          ./project/scripts/bootstrappedOnlyCmdTests

  test-scala3-sbt-bridge-nonbootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `scala3-sbt-bridge-nonbootstrapped`
        run: ./project/scripts/sbt scala3-sbt-bridge-nonbootstrapped/test

  test-scala3-sbt-bridge-nonbootstrapped-compiler-interface-2:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    env:
      SBT_COMPILER_INTERFACE_VERSION: 2.0.5
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `scala3-sbt-bridge-nonbootstrapped` against compiler-interface 2.x
        run: ./project/scripts/sbt scala3-sbt-bridge-nonbootstrapped/test

  test-scala3-sbt-bridge-bootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `scala3-sbt-bridge-bootstrapped`
        run: ./project/scripts/sbt scala3-sbt-bridge-bootstrapped/test

  test-tasty-core-nonbootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `tasty-core-nonbootstrapped`
        run: ./project/scripts/sbt tasty-core-nonbootstrapped/test

  test-tasty-core-bootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `tasty-core-bootstrapped`
        run: ./project/scripts/sbt tasty-core-bootstrapped/test

  test-scala3-directives-parser-nonbootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `scala3-directives-parser-nonbootstrapped`
        run: ./project/scripts/sbt scala3-directives-parser-nonbootstrapped/test

  test-scala3-directives-parser-bootstrapped:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `scala3-directives-parser-bootstrapped`
        run: ./project/scripts/sbt scala3-directives-parser-bootstrapped/test

  test-scala-js:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Scala.js compiler tests
        run: ./project/scripts/sbt "sjsCompilerTests/test"
      - name: Scala.js sandbox
        run: ./project/scripts/sbt ";sjsSandbox/run ;sjsSandbox/test"
      - name: Scala.js JUnit tests
        run: ./project/scripts/sbt ";sjsJUnitTests/test ;set sjsJUnitTests/scalaJSLinkerConfig ~= switchToESModules ;sjsJUnitTests/test"
      - name: Scala.js JUnit tests with latest ES version
        run: ./project/scripts/sbt ";sjsJUnitTests/clean ;set sjsJUnitTests/scalaJSLinkerConfig ~= switchToLatestESVersion ;sjsJUnitTests/test"
      - name: Scala.js JUnit tests with WebAssembly
        run: ./project/scripts/sbt ";sjsJUnitTests/clean ;set Global/enableWebAssembly := true; sjsJUnitTests/test"
  # TODO Scala.js on Windows

  test-repl:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 25, 27]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ matrix.jdk }} (REPL subprocess)
        id: jdk
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: ${{ matrix.jdk }}
      - name: Set up JDK 17 (build, default)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
          # the dependencies are the same for all JDKs
          ignoreMatrix: 'true'
      # scala-cli-setup also installs a JVM and overrides JAVA_HOME, so it must
      # match the JDK 17 set up above. sbt runs on this JVM.
      - uses: VirtusLab/scala-cli-setup@9d61091a7d9d19f69faa59b31cdbc6ef2537eccc # v1.19.0
        with:
          jvm: corretto:17
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test REPL on JDK ${{ matrix.jdk }}
        env:
          DOTTY_REPL_TEST_JAVA_HOME: ${{ steps.jdk.outputs.path }}
          DOTTY_REPL_TEST_SCALA_CLI_EXECUTABLE: scala-cli
        run: ./project/scripts/sbt scala3-repl/test

  test-presentation-compiler:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test Presentation Compiler
        run: ./project/scripts/sbt scala3-presentation-compiler/test

  test-staging:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          check-latest: true
          java-version: 17
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
        with:
          cacheMode: ${{ github.ref != 'refs/heads/main' && 'read' || '' }}
      - uses: sbt/setup-sbt@20cf087132cf939c160f0e53f87ba33634003e3e # v1.5.16
      - name: Test `scala3-staging`
        run: ./project/scripts/sbt scala3-staging/test
