###################################################################################################
###                   THIS IS A REUSABLE WORKFLOW TO PUBLISH SCALA TO SDKMAN!                   ###
### HOW TO USE:                                                                                 ###
###   - THE RELEASE WORKFLOW SHOULD CALL THIS WORKFLOW                                          ###
###   - IT WILL PUBLISH TO SDKMAN! THE BINARIES TO EACH SUPPORTED PLATFORM AND A UNIVERSAL JAR  ###
###   - IT CHANGES THE DEFAULT VERSION IN SDKMAN!                                               ###
###                                                                                             ###
### NOTE:                                                                                       ###
###   - WE SHOULD KEEP IN SYNC THE NAME OF THE ARCHIVES WITH THE ACTUAL BUILD                   ###
###   - WE SHOULD KEEP IN SYNC THE URL OF THE RELEASE                                           ###
###################################################################################################


name: Publish Scala to SDKMAN!
run-name: Publish Scala ${{ inputs.version }} to SDKMAN!

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      SDKMAN_EMAIL:
        required: true
      SDKMAN_PASSWORD:
        required: true

# Publishes to SDKMAN! with vendor credentials no GITHUB_TOKEN use
permissions: {}

env:
  # The download URLs handed to sdkman point at the releases of the repository
  # that ran the workflow. Only the scala/scala3 releases are real sdkman targets.
  RELEASE-URL: 'https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}'

jobs:
  # Never push to SDKMAN! from a fork, regardless of how this workflow is called
  publish:
    if: github.repository == 'scala/scala3'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: LINUX_X64
            archive : 'scala3-${{ inputs.version }}-x86_64-pc-linux.zip'
          - platform: LINUX_ARM64
            archive : 'scala3-${{ inputs.version }}-aarch64-pc-linux.zip'
          - platform: MAC_X64
            archive : 'scala3-${{ inputs.version }}-x86_64-apple-darwin.zip'
          - platform: MAC_ARM64
            archive : 'scala3-${{ inputs.version }}-aarch64-apple-darwin.zip'
          - platform: WINDOWS_X64
            archive : 'scala3-${{ inputs.version }}-x86_64-pc-win32.zip'
    steps:
      - uses: sdkman/sdkman-release-action@92ab12086a18d531353f9a032eca59a8f9f7d161 # v1.0.0
        with:
          email    : ${{ secrets.SDKMAN_EMAIL }}
          password : ${{ secrets.SDKMAN_PASSWORD }}
          candidate: scala
          version  : ${{ inputs.version }}
          url      : '${{ env.RELEASE-URL }}/${{ matrix.archive }}'
          platform : ${{ matrix.platform }}

  # The stable tag is the default version. Apply it only after every platform
  # publish succeeds, by upserting one already-published platform.
  default:
    if: github.repository == 'scala/scala3'
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: sdkman/sdkman-release-action@92ab12086a18d531353f9a032eca59a8f9f7d161 # v1.0.0
        with:
          email    : ${{ secrets.SDKMAN_EMAIL }}
          password : ${{ secrets.SDKMAN_PASSWORD }}
          candidate: scala
          version  : ${{ inputs.version }}
          url      : '${{ env.RELEASE-URL }}/scala3-${{ inputs.version }}-x86_64-pc-linux.zip'
          platform : LINUX_X64
          tags     : stable
