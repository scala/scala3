name: Miscellaneous Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  scripted-tests:
    name: scripted-tests (${{ matrix.jdk }})
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk: 17
            command: scala3-bootstrapped/scripted
          - jdk: 25
            command: scala3-bootstrapped/scripted sbt-bridge/main-discovery sbt-bridge/main-discovery-scalajs java-compat/i27460
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.jdk }}
          cache: 'sbt'
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Run SBT scripted tests
        run: ./project/scripts/sbt "${{ matrix.command }}"

  test-bisect-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - uses: VirtusLab/scala-cli-setup@9d61091a7d9d19f69faa59b31cdbc6ef2537eccc # v1.19.0
        with:
          jvm: temurin:17
      - name: Run bisect script tests
        run: scala-cli test project/scripts/bisect.test.scala
