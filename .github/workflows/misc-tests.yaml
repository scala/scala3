name: Miscellaneous Tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  scripted-tests:
    name: scripted-tests (${{ matrix.jdk }})
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, '[skip ci]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jdk: 17
            command: scala3-bootstrapped/scripted
          - jdk: 25
            command: scala3-bootstrapped/scripted sbt-bridge/main-discovery sbt-bridge/main-discovery-scalajs
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'sbt'
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - name: Run SBT scripted tests
        run: ./project/scripts/sbt "${{ matrix.command }}"

  test-bisect-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8.2.0
      - uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0
        with:
          jvm: temurin:17
      - name: Run bisect script tests
        run: scala-cli test project/scripts/bisect.test.scala
